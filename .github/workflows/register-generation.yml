name: Register Artifact Consistency

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/register_map.csv'
      - 'scripts/gen_register_artifacts.py'
      - 'rtl/config_registers.sv'
      - 'docs/register_map.md'
      - '.github/workflows/register-generation.yml'

env:
  REPO_ROOT: ${{ github.workspace }}
  SCRIPTS_ROOT: ${{ github.workspace }}/scripts
  DV_ROOT: ${{ github.workspace }}/dv
  RTL_ROOT: ${{ github.workspace }}/rtl
  LINT_ROOT: ${{ github.workspace }}/lint
  SCHEMATICS_ROOT: ${{ github.workspace }}/schematics
  DOCS_ROOT: ${{ github.workspace }}/docs

jobs:
  check-generated-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Regenerate artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 "$SCRIPTS_ROOT/gen_register_artifacts.py"

      - name: Verify no artifact drift
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- "$RTL_ROOT/config_registers.sv" "$DOCS_ROOT/register_map.md"; then
            echo "Generated artifacts are out of date. Run scripts/gen_register_artifacts.py and commit results." >&2
            exit 1
          fi
